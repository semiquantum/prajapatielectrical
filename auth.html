<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login / Sign Up | Prajapati Electrical</title>
  <meta name="description" content="Login or create an account to book electrical services with Prajapati Electrical.">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="images/favicon.png">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Styles -->
  <link rel="stylesheet" href="css/auth.css">
  
  <style>
    /* Custom override for select icon styling */
    .input-icon-wrap select {
      padding-left: 40px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: white;
      width: 100%;
      height: 50px;
      border-radius: 12px;
      outline: none;
      appearance: none;
      font-size: 0.95rem;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
    }
    .input-icon-wrap select option {
      background: #1E293B;
      color: white;
    }
  </style>
</head>
<body>

<div class="auth-page">
  <!-- Background Effects -->
  <div class="auth-bg-effects">
    <div class="auth-glow auth-glow-1"></div>
    <div class="auth-glow auth-glow-2"></div>
    <div class="auth-glow auth-glow-3"></div>
  </div>

  <div class="auth-container">
    <!-- Logo -->
    <div class="auth-logo">
      <a href="index.html">
        <img src="images/logo.png" alt="Prajapati Electrical" width="52" height="52">
        <span>Prajapati Electrical</span>
      </a>
    </div>

    <!-- Auth Card -->
    <div class="auth-card">
      <!-- Main Auth View -->
      <div id="auth-main-view">
        <h2 id="auth-heading">Welcome Back</h2>
        <p class="auth-subtitle" id="auth-subtitle">Login to book services & manage your account</p>

        <!-- Tabs -->
        <div class="auth-tabs">
          <button class="auth-tab active" data-tab="login" id="tab-login">Login</button>
          <button class="auth-tab" data-tab="signup" id="tab-signup">Sign Up</button>
        </div>

        <!-- Message -->
        <div class="auth-message" id="auth-message">
          <i class="fas fa-info-circle"></i>
          <span id="auth-message-text"></span>
        </div>

        <!-- Login Form -->
        <form class="auth-form active" id="login-form" autocomplete="on">
          <div class="form-group">
            <label for="login-email">Email Address</label>
            <div class="input-icon-wrap">
              <i class="fas fa-envelope"></i>
              <input type="email" id="login-email" placeholder="your@email.com" required autocomplete="email">
            </div>
          </div>

          <div class="form-group">
            <label for="login-password">Password</label>
            <div class="input-icon-wrap">
              <i class="fas fa-lock"></i>
              <input type="password" id="login-password" placeholder="Enter your password" required autocomplete="current-password">
              <button type="button" class="password-toggle" data-target="login-password" aria-label="Toggle password visibility">
                <i class="fas fa-eye"></i>
              </button>
            </div>
          </div>

          <div class="auth-forgot">
            <a href="#" id="forgot-password-link">Forgot Password?</a>
          </div>

          <button type="submit" class="auth-submit" id="login-btn">
            <span class="btn-text"><i class="fas fa-sign-in-alt"></i> Login</span>
            <span class="spinner"></span>
          </button>
        </form>

        <!-- Signup Form -->
        <form class="auth-form" id="signup-form" autocomplete="on">
          <div class="form-row">
            <div class="form-group">
              <label for="signup-name">Full Name</label>
              <div class="input-icon-wrap">
                <i class="fas fa-user"></i>
                <input type="text" id="signup-name" placeholder="Your Name" required autocomplete="name">
              </div>
            </div>
            <div class="form-group">
              <label for="signup-phone">Phone Number</label>
              <div class="input-icon-wrap">
                <i class="fas fa-phone"></i>
                <input type="tel" id="signup-phone" placeholder="+91 XXXXXXXXXX" autocomplete="tel">
              </div>
            </div>
          </div>

          <div class="form-group">
            <label for="signup-role">Register Account As</label>
            <div class="input-icon-wrap" style="position:relative;">
              <i class="fas fa-user-tag" style="position:absolute; left:16px; top:50%; transform:translateY(-50%); color:rgba(255,255,255,0.4); z-index:10;"></i>
              <select id="signup-role" required>
                <option value="customer">Customer (Standard)</option>
                <option value="employee">Employee / Technician</option>
                <option value="distributor">B2B Distributor</option>
                <option value="dealer">B2B Dealer</option>
                <option value="retailer">B2B Retailer</option>
                <option value="franchise_partner">Franchise Partner</option>
                <option value="vendor">Supply Vendor</option>
                <option value="manager">Operations Manager</option>
                <option value="owner">Business Owner</option>
                <option value="admin">System Administrator</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label for="signup-email">Email Address</label>
            <div class="input-icon-wrap">
              <i class="fas fa-envelope"></i>
              <input type="email" id="signup-email" placeholder="your@email.com" required autocomplete="email">
            </div>
          </div>

          <div class="form-group">
            <label for="signup-password">Password</label>
            <div class="input-icon-wrap">
              <i class="fas fa-lock"></i>
              <input type="password" id="signup-password" placeholder="Min 6 characters" required minlength="6" autocomplete="new-password">
              <button type="button" class="password-toggle" data-target="signup-password" aria-label="Toggle password visibility">
                <i class="fas fa-eye"></i>
              </button>
            </div>
          </div>

          <button type="submit" class="auth-submit" id="signup-btn">
            <span class="btn-text"><i class="fas fa-user-plus"></i> Create Account</span>
            <span class="spinner"></span>
          </button>
        </form>
      </div>

      <!-- Reset Password View -->
      <div class="auth-reset-view" id="auth-reset-view">
        <button type="button" class="auth-reset-back" id="reset-back-btn">
          <i class="fas fa-arrow-left"></i> Back to Login
        </button>
        <h2>Reset Password</h2>
        <p>Enter your email and we'll send you a link to reset your password.</p>

        <div class="auth-message" id="reset-message">
          <i class="fas fa-info-circle"></i>
          <span id="reset-message-text"></span>
        </div>

        <form id="reset-form">
          <div class="form-group">
            <label for="reset-email">Email Address</label>
            <div class="input-icon-wrap">
              <i class="fas fa-envelope"></i>
              <input type="email" id="reset-email" placeholder="your@email.com" required>
            </div>
          </div>

          <button type="submit" class="auth-submit" id="reset-btn">
            <span class="btn-text"><i class="fas fa-paper-plane"></i> Send Reset Link</span>
            <span class="spinner"></span>
          </button>
        </form>
      </div>
    </div>

      <!-- OTP Verification View -->
      <div class="auth-otp-view" id="auth-otp-view" style="display: none;">
        <button type="button" class="auth-reset-back" id="otp-back-btn">
          <i class="fas fa-arrow-left"></i> Back
        </button>
        <h2>Verify Email</h2>
        <p>We've sent a 6-digit code to <span id="otp-target-email" style="font-weight:600;color:var(--text-primary);">your email</span>.</p>

        <div class="auth-message" id="otp-message">
          <i class="fas fa-info-circle"></i>
          <span id="otp-message-text"></span>
        </div>

        <form id="otp-form">
          <div class="form-group" style="text-align:center;">
            <label for="otp-code">Enter Verification Code</label>
            <input type="text" id="otp-code" placeholder="------" required maxlength="6" style="text-align:center; font-size:2rem; letter-spacing:10px; width:100%; padding:10px; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.12); color:white; border-radius:12px; font-family:'Outfit',sans-serif; outline:none;">
          </div>

          <button type="submit" class="auth-submit" id="otp-btn">
            <span class="btn-text"><i class="fas fa-check-circle"></i> Verify Account</span>
            <span class="spinner"></span>
          </button>
        </form>
        
        <div style="text-align:center; margin-top: 20px; font-size: 0.9rem;">
          <button type="button" id="resend-otp-btn" style="background:none; border:none; color:var(--accent); cursor:pointer; font-weight:600;">Resend Code</button>
          <span id="resend-timer" style="color:var(--text-secondary); display:none;">(60s)</span>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div class="auth-back">
      <a href="index.html"><i class="fas fa-arrow-left"></i> Back to Home</a>
    </div>
  </div>
</div>

<!-- Supabase JS SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
